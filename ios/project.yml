name: MarketObservatory
options:
  bundleIdPrefix: com.audichuang
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 37HFR5V2JJ
    CODE_SIGN_STYLE: Automatic
targets:
  MarketObservatory:
    type: application
    platform: iOS
    sources:
      - MarketObservatory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.observatory
        PRODUCT_NAME: MarketObservatory
        INFOPLIST_KEY_CFBundleDisplayName: 觀測室
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: MarketObservatory/MarketObservatory.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
  MarketObservatoryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MarketObservatoryUITests
    dependencies:
      - target: MarketObservatory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.audichuang.observatory.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MarketObservatory
schemes:
  MarketObservatory:
    build:
      targets:
        MarketObservatory: all
    test:
      targets:
        - MarketObservatoryUITests
    run:
      config: Debug
    archive:
      config: Release
